<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS Boost Lab</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f172a">

<style>
body{
  background:linear-gradient(135deg,#020617,#0f172a,#020617);
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
  margin:0;
}
h1{
  color:#38bdf8;
  font-size:36px;
  margin-bottom:10px;
}
.subtitle{
  color:#94a3b8;
  margin-bottom:20px;
}
.container{
  background:#1e293b;
  padding:30px;
  border-radius:15px;
  width:420px;
  margin:auto;
  box-shadow:0px 0px 20px rgba(0,0,0,0.5);
}
select,input,button{
  padding:12px;
  margin:10px 0;
  width:85%;
  border-radius:8px;
  border:none;
  font-size:14px;
}
select,input{
  background:#0f172a;
  color:white;
}
button{
  background:#38bdf8;
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
button:hover{
  background:#0ea5e9;
}
.resultado{
  margin-top:20px;
  background:#020617;
  padding:20px;
  border-radius:10px;
  color:#38bdf8;
  font-weight:bold;
}
.footer{
  margin-top:30px;
  color:#64748b;
  font-size:12px;
}
.btn-afiliado{
  display:inline-block;
  padding:10px 20px;
  margin:5px;
  background:#38bdf8;
  color:black;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}
.btn-afiliado:hover{
  background:#0ea5e9;
}
@media (max-width: 480px){
  .container{
    width:90%;
    padding:20px;
  }
  select,input,button{
    width:95%;
  }
}
</style>
</head>

<body>

<h1 id="title">FPS Boost Lab</h1>
<p class="subtitle" id="subtitle">Optimiza tu PC para obtener más FPS en tus juegos</p>

<p>Idioma / Language:</p>
<select id="lang" onchange="cambiarIdioma()">
  <option value="es">Español</option>
  <option value="en">English</option>
</select>

<div class="container">
  <p id="selectConfig">Selecciona tu configuración</p>

  <select id="ram"></select>
  <input list="gpus" id="gpu" placeholder="">
  <datalist id="gpus"></datalist>

  <select id="game"></select>

  <p id="calidadLabel">Calidad gráfica</p>
  <select id="calidad"></select>

  <button onclick="optimizar()" id="btnAnalizar">Analizar rendimiento</button>

  <div class="resultado" id="resultado">Aquí aparecerán tus configuraciones recomendadas</div>
</div>

<div class="footer" id="footer">FPSBoost Lab - Herramienta de optimizaciónes</div>

<script>
// Textos estáticos
const textos = {
  es: {
    title: "FPS Boost Lab",
    subtitle: "Optimiza tu PC para obtener más FPS en tus juegos",
    selectConfig: "Selecciona tu configuración",
    calidadGrafica: "Calidad gráfica",
    boton: "Analizar rendimiento",
    resultadoDefault: "Aquí aparecerán tus configuraciones recomendadas",
    footer: "FPSBoost Lab - Herramienta de optimizaciónes",
    comprarGPU: "Comprar GPU recomendada",
    comprarRAM: "Comprar RAM recomendada",
    ram: ["1GB RAM","2GB RAM","4GB RAM","6GB RAM","8GB RAM","12GB RAM","16GB RAM","32GB RAM"],
    juegos: ["Minecraft","Valorant","Fortnite","CS2","GTA V","Roblox","League of Legends","Apex Legends","Warzone"],
    calidad: ["Mínimo","Bajo","Medio","Alto","Ultra"]
  },
  en: {
    title: "FPS Boost Lab",
    subtitle: "Optimize your PC for higher FPS in games",
    selectConfig: "Select your configuration",
    calidadGrafica: "Graphics quality",
    boton: "Analyze performance",
    resultadoDefault: "Your recommended settings will appear here",
    footer: "FPSBoost Lab - Optimization tool",
    comprarGPU: "Buy recommended GPU",
    comprarRAM: "Buy recommended RAM",
    ram: ["1GB RAM","2GB RAM","4GB RAM","6GB RAM","8GB RAM","12GB RAM","16GB RAM","32GB RAM"],
    juegos: ["Minecraft","Valorant","Fortnite","CS2","GTA V","Roblox","League of Legends","Apex Legends","Warzone"],
    calidad: ["Minimum","Low","Medium","High","Ultra"]
  }
};

// GPUs fijas
const gpuList = ["Intel HD 4000","Intel UHD 605","Intel UHD 620","Intel Iris Xe",
"GTX 750","GTX 950","GTX 1050","GTX 1050 Ti","GTX 1650","GTX 1660",
"RTX 2060","RTX 3060","RTX 4060","RX 560","RX 570","RX 580","RX 6500","RX 6600"];

// Cambiar idioma dinámico
function cambiarIdioma(){
  const lang = document.getElementById("lang").value;
  const t = textos[lang];
  document.getElementById("title").innerText = t.title;
  document.getElementById("subtitle").innerText = t.subtitle;
  document.getElementById("selectConfig").innerText = t.selectConfig;
  document.getElementById("calidadLabel").innerText = t.calidadGrafica;
  document.getElementById("btnAnalizar").innerText = t.boton;
  document.getElementById("resultado").innerText = t.resultadoDefault;
  document.getElementById("footer").innerText = t.footer;

  // Llenar RAM
  let ramSelect = document.getElementById("ram");
  ramSelect.innerHTML = "";
  t.ram.forEach(r => { ramSelect.innerHTML += `<option>${r}</option>` });

  // Llenar juegos
  let gameSelect = document.getElementById("game");
  gameSelect.innerHTML = "";
  t.juegos.forEach(g => { gameSelect.innerHTML += `<option>${g}</option>` });

  // Llenar calidad
  let calSelect = document.getElementById("calidad");
  calSelect.innerHTML = "";
  t.calidad.forEach(c => { calSelect.innerHTML += `<option>${c}</option>` });

  // Placeholder GPU
  document.getElementById("gpu").placeholder = lang=="es"?"Escribe tu tarjeta gráfica":"Type your GPU";
  // Llenar datalist
  let gpuDatalist = document.getElementById("gpus");
  gpuDatalist.innerHTML = "";
  gpuList.forEach(g => { gpuDatalist.innerHTML += `<option value="${g}">` });
}

// Inicializa idioma por defecto
cambiarIdioma();

// Optimización de FPS
function optimizar() {
  let lang = document.getElementById("lang").value;
  let ram = document.getElementById("ram").value;
  let gpu = document.getElementById("gpu").value;
  let game = document.getElementById("game").value;
  let calidad = document.getElementById("calidad").value;

  let fps = 0;

  // GPU
  if(gpu == "Intel HD 4000"){ fps += 40 }
  else if(gpu == "Intel UHD 605"){ fps += 60 }
  else if(gpu == "Intel UHD 620"){ fps += 80 }
  else if(gpu == "Intel Iris Xe"){ fps += 140 }
  else if(gpu == "GTX 750"){ fps += 120 }
  else if(gpu == "GTX 950"){ fps += 160 }
  else if(gpu == "GTX 1050"){ fps += 200 }
  else if(gpu == "GTX 1050 Ti"){ fps += 240 }
  else if(gpu == "GTX 1650"){ fps += 300 }
  else if(gpu == "GTX 1660"){ fps += 350 }
  else if(gpu == "RTX 2060"){ fps += 420 }
  else if(gpu == "RTX 3060"){ fps += 520 }
  else if(gpu == "RTX 4060"){ fps += 650 }
  else if(gpu == "RX 560"){ fps += 180 }
  else if(gpu == "RX 570"){ fps += 260 }
  else if(gpu == "RX 580"){ fps += 300 }
  else if(gpu == "RX 6500"){ fps += 340 }
  else if(gpu == "RX 6600"){ fps += 500 }

  // RAM
  if(ram == "1GB RAM"){ fps -= 120 }
  else if(ram == "2GB RAM"){ fps -= 80 }
  else if(ram == "4GB RAM"){ fps -= 40 }
  else if(ram == "6GB RAM"){ fps -= 20 }
  else if(ram == "8GB RAM"){ fps += 0 }
  else if(ram == "12GB RAM"){ fps += 20 }
  else if(ram == "16GB RAM"){ fps += 40 }
  else if(ram == "32GB RAM"){ fps += 80 }

  // Juegos
  if(game == "Minecraft"){ fps += 120 }
  else if(game == "Valorant"){ fps += 100 }
  else if(game == "Roblox"){ fps += 90 }
  else if(game == "League of Legends"){ fps += 110 }
  else if(game == "CS2"){ fps -= 60 }
  else if(game == "Fortnite"){ fps -= 80 }
  else if(game == "GTA V"){ fps -= 100 }
  else if(game == "Apex Legends"){ fps -= 120 }
  else if(game == "Warzone"){ fps -= 180 }

  // Calidad gráfica
  if(calidad == textos[lang].calidad[0]){ fps *= 1.35 }
  else if(calidad == textos[lang].calidad[1]){ fps *= 1.15 }
  else if(calidad == textos[lang].calidad[2]){ fps *= 1 }
  else if(calidad == textos[lang].calidad[3]){ fps *= 0.75 }
  else if(calidad == textos[lang].calidad[4]){ fps *= 0.55 }

  if(fps < 5){ fps = 5 }
  let fpsMostrar = Math.round(fps);
  if(fps > 500){ fpsMostrar = "500+" }

  // Score
  let score = Math.round(fps / 5);
  if(score > 100){ score = 100 }
  if(score < 1){ score = 1 }

  // Nivel
  let nivel = "";
  if(score < 20){ nivel = lang=="es"?"PC gama baja":"Low-end PC" }
  else if(score < 40){ nivel = lang=="es"?"PC gama media":"Mid-range PC" }
  else if(score < 70){ nivel = lang=="es"?"PC gama alta":"High-end PC" }
  else{ nivel = lang=="es"?"PC de muy alta gama":"Top-tier PC" }

  // Recomendación
  let recomendacion = "";
  if(fps < 30){ recomendacion = lang=="es"?"Usar gráficos en MÍNIMO":"Use MINIMUM graphics" }
  else if(fps < 60){ recomendacion = lang=="es"?"Usar gráficos en BAJO":"Use LOW graphics" }
  else if(fps < 120){ recomendacion = lang=="es"?"Usar gráficos en MEDIO":"Use MEDIUM graphics" }
  else if(fps < 200){ recomendacion = lang=="es"?"Usar gráficos en ALTO":"Use HIGH graphics" }
  else{ recomendacion = lang=="es"?"Tu PC puede jugar en ULTRA sin problemas":"Your PC can run ULTRA without problems" }

  // Botones de afiliados
  let afiliados = `<div class="afiliados">
    <a href="https://www.amazon.com/?tag=joelpem-20" target="_blank" class="btn-afiliado">${textos[lang].comprarGPU}</a>
    <a href="https://www.amazon.com/?tag=joelpem-20" target="_blank" class="btn-afiliado">${textos[lang].comprarRAM}</a>
  </div>`;

  let resultado = 
  "🎮 FPS estimados: " + fpsMostrar + " FPS <br><br>" +
  "⚙️ Calidad seleccionada: " + calidad + "<br><br>" +
  "📊 Score del sistema: " + score + "/100 <br><br>" +
  nivel + "<br><br>" +
  "💡 " + recomendacion + "<br><br>" +
  afiliados;

  document.getElementById("resultado").innerHTML = resultado;
}
</script>
</body>
</html>
